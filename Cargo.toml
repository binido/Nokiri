[package]
name = "nokiri"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A small, deliberate desktop proxy manager"
repository = "https://github.com/binido/Nokiri"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
directories = "6"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
fs2 = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3.6", default-features = false }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "io-util", "net", "macros", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSWindow", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSNotification", "NSGeometry", "NSAppleEventManager", "NSAppleEventDescriptor"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
